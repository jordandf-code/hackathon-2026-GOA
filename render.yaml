services:
  - type: web
    name: pg-recon-proxy
    runtime: python
    rootDir: proxy
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PROXY_TOKEN
        sync: false
      - key: MAX_ROWS
        value: "10000"
      - key: STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: PYTHON_VERSION
        value: "3.12.7"
