    pledge_amount_cad: null
    pledge_window: [2021-06-01, 2028-12-31]
    description_en: >
      The UN Declaration on the Rights of Indigenous Peoples Act requires the
      federal government to align Canadian laws with UNDRIP and to publish an
      Action Plan in consultation with Indigenous peoples. The 2023 Action Plan
      contains numbered measures across many departments; specific funding
      envelopes are spread across budgets.
    query_hints:
      departments: null
      recipient_types: [A]
      keywords: [UNDRIP, UN Declaration, Declaration Act, Indigenous rights, self-determination]
      exclude_keywords: []
      date_range: [2021-06-01, 2025-12-31]
    source_url: ""
    status_notes: No single dollar headline; agent should aggregate by Action Plan measure where possible. Useful as a "broad surface" reference.
    confidence: medium

