# Federal commitments seed for the policy-alignment demo.
#
# Hand-curated from public Government of Canada announcements (mandate
# letters, budgets, official program pages). Each entry is what a PBO-style
# auditor would treat as a "stated commitment" to test against actual
# spending in fed.grants_contributions and public.contracts.
#
# Schema:
#   id                  Stable slug (kebab-case). Used as primary key.
#   theme               Top-level theme (reconciliation | emissions | housing | healthcare).
#                       For the v1 demo we only seed reconciliation.
#   sub_theme           Free-form sub-bucket for grouping in the UI.
#   title               One-line human-readable title.
#   pledge_source       Where the commitment was made (Budget X, mandate
#                       letter, throne speech, settlement agreement, etc.).
#   pledge_year         Year the commitment was first publicly stated.
#   target_date         Date the commitment was meant to be met. null if
#                       open-ended / ongoing.
#   pledge_amount_cad   Total CAD pledged. null if no headline number, or if
#                       the commitment is non-monetary (e.g. "lift X by Y").
#   pledge_window:      [start, end] dates over which the pledged amount is
#                       intended to flow (helps when pledge_amount_cad is set).
#   description_en      1-3 sentence plain-English description.
#   query_hints:        Structured guidance for the spending-query agent.
#     departments       owner_org slugs to filter on. null = all departments.
#                       NOTE: validate against
#                       SELECT DISTINCT owner_org FROM fed.grants_contributions
#                       at agent boot — slugs in this file are placeholders
#                       and may not match the dataset exactly.
#     recipient_types   fed.grants_contributions.recipient_type codes.
#                       'A' = Indigenous recipients per fed.recipient_type_lookup.
#     keywords          Inclusive match against prog_name_en, prog_purpose_en,
#                       agreement_title_en, description_en, expected_results_en.
#     exclude_keywords  Negative match (false-positive guard).
#     date_range        Filter on agreement_start_date.
#   source_url          Citation URL. Empty = TODO; fill before demo.
#   status_notes        Known progress / shortfall context for the narrative.
#   confidence          high / medium / low — how sure we are the pledge text,
#                       amount, and date below are correct as stated. Verify
#                       medium / low before publishing.
#
# Department slugs to validate at boot (best-guess):
#   isc-sac     Indigenous Services Canada
#   cirnac      Crown-Indigenous Relations and Northern Affairs Canada
#   cmhc-schl   Canada Mortgage and Housing Corporation
#   wage-fegc   Women and Gender Equality Canada
#   pch         Canadian Heritage
#   eccc        Environment and Climate Change Canada
#   nrcan-rncan Natural Resources Canada
#   hc-sc       Health Canada

commitments:

  - id: water-advisories-lift-2021
    theme: reconciliation
    sub_theme: indigenous_services
    title: Lift all long-term drinking-water advisories on public First Nations water systems
    pledge_source: Liberal Party platform 2015; reiterated in mandate letters and Budget 2016
    pledge_year: 2015
    target_date: 2021-03-31
    pledge_amount_cad: null
    pledge_window: [2016-04-01, 2021-03-31]
    description_en: >
      Federal government committed to lift all long-term drinking-water advisories
      on public First Nations water systems on reserve by March 2021. The original
      target was missed; the program has continued past the deadline with multiple
      additional rounds of funding through Indigenous Services Canada.
    query_hints:
      departments: [isc-sac, aandc-aadnc]
      recipient_types: [A]
      keywords: [water, drinking water, water advisory, boil water, potable, water treatment, water infrastructure, wastewater]
      exclude_keywords: [stormwater]
      date_range: [2015-04-01, 2025-12-31]
    source_url: ""
    status_notes: Target missed in 2021; advisories remained as of recent reporting. Compare cumulative ISC water-related grants/contributions vs the implicit funding envelope in budgets 2016-2024.
    confidence: high

  - id: jordans-principle
    theme: reconciliation
    sub_theme: child_welfare
    title: Fund all eligible Jordan's Principle requests for First Nations children
    pledge_source: Canadian Human Rights Tribunal orders 2016+; ongoing ISC commitment
    pledge_year: 2016
    target_date: null
    pledge_amount_cad: null
    pledge_window: [2016-04-01, 2026-03-31]
    description_en: >
      Federal commitment, enforced via Canadian Human Rights Tribunal orders, to
      fund all eligible Jordan's Principle requests so First Nations children can
      access health, social, and education services without jurisdictional delay.
      Annual expenditure has grown from sub-$100M to multi-billion in recent years.
    query_hints:
      departments: [isc-sac]
      recipient_types: [A, P]
      keywords: ["Jordan's Principle", Jordans Principle, child and family services, First Nations child]
      exclude_keywords: []
      date_range: [2016-04-01, 2025-12-31]
    source_url: ""
    status_notes: Volume of approved requests has scaled order-of-magnitude. Test whether grants/contributions tagged to Jordan's Principle by program name match the public expenditure totals reported by ISC.
    confidence: high

